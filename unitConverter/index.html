<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chris unit converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "main-container">
    <h1 style="color: #fff">Metric/Imperial Unit Conversion</h1>
    <div>
        <input type="number" id="value-input" class="no-scroll-arrows" onwheel="this.blur()">
    </div>
    <button id="convert-btn">Convert</button>

    <div class="container">
        <div class="units" id="length">
            <h2>Length (Meter/Feet)</h2>
            <p id="length-result"></p>
        </div>
        <div class="units" id="volume">
            <h2>Volume (Liters/Gallons)</h2>
            <p id="volume-result"></p>
        </div>
        <div class="units" id="mass">
            <h2>Mass (Kilograms/Pounds)</h2>
            <p id="mass-result"></p>
        </div>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
